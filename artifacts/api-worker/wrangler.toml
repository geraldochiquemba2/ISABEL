# isabel-api — Cloudflare Worker (substitui o Node/Express no Render).
# Preencher antes do primeiro deploy (valores na conta Cloudflare):
#   - account_id: Account ID (Workers & Pages > Overview, canto direito)
#   - DATABASE_URL, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID: wrangler secret put
# Imagens: Telegram + Cache API do edge (R2 exige cartão; sem R2 por agora).
name = "isabel-api"
main = "src/index.ts"
account_id = "2c443f43d8abe065f0ce56780dba467f"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
# RENDER_EXTERNAL_URL já não é preciso (sem sleep no Workers)
# PASSWORD_ITERATIONS só no plano free (10ms CPU -> erro 1101 acima disso):
#   wrangler secret put PASSWORD_ITERATIONS # valor 5000
# No pago/Node, omite (default 100000).

[triggers]
# Verificação de assinaturas vencidas (era setInterval de 1h no Node)
# + keep-alive de 30min: o Neon adormece aos ~5min e acordar custa 5-10s.
# NOTA quota: o free dá 100 CU-h/mês; keep-alive de 2min mantinha o compute
# acordado 24/7 (0.25 CU x 720h = 180 CU-h > 100 = suspensão a meio do mês!).
# A cada 30min o duty fica ~18% (~30 CU-h/mês com o tráfego normal): seguro.
crons = ["0 * * * *", "*/30 * * * *"]
