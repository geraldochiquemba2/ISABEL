<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Arco superior -->
  <path d="M25 35 Q50 15 75 35" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Letra E estilizada -->
  <text x="30" y="72" font-family="Georgia, serif" font-size="55" font-weight="bold" fill="white">E</text>
  
  <!-- Estrela/brilho -->
  <g transform="translate(72, 28)">
    <!-- Raios principais -->
    <line x1="0" y1="-8" x2="0" y2="8" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="-8" y1="0" x2="8" y2="0" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <!-- Raios diagonais -->
    <line x1="-5" y1="-5" x2="5" y2="5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="5" y1="-5" x2="-5" y2="5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Raios extras -->
    <line x1="0" y1="-5" x2="0" y2="-12" stroke="white" stroke-width="1" stroke-linecap="round"/>
    <line x1="0" y1="5" x2="0" y2="12" stroke="white" stroke-width="1" stroke-linecap="round"/>
    <line x1="-5" y1="0" x2="-12" y2="0" stroke="white" stroke-width="1" stroke-linecap="round"/>
    <line x1="5" y1="0" x2="12" y2="0" stroke="white" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>