<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2c3035" />
    <title>YESOLA Collection</title>
    <meta name="description" content="YESOLA Collection — Tudo o que procurais, encontrais aqui." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="YESOLA Collection" />
    <meta property="og:description" content="YESOLA Collection — Tudo o que procurais, encontrais aqui." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="YESOLA Collection" />
    <meta name="twitter:description" content="YESOLA Collection — Tudo o que procurais, encontrais aqui." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="YESOLA" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="preload" as="image" href="/logo-yesola-splash.png" fetchpriority="high" />
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #ffffff;
        color: #0b0b0c;
        font-family: "DM Sans", system-ui, sans-serif;
        pointer-events: all;
        touch-action: none;
        opacity: 1;
        transition: opacity 0.25s ease;
      }
      #boot-splash img {
        width: 150px;
        max-width: 55vw;
        height: auto;
        display: block;
        filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.15));
      }
      #boot-splash span {
        font-size: 13px;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: #b8860b;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <img src="/logo-yesola-splash.png" alt="YESOLA" fetchpriority="high" />
      <span>YESOLA Collection</span>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var el = document.getElementById("boot-splash");
        if (!el) return;
        var done = false;
        window.__yesolaHideBootSplash = function () {
          if (done || !el) return;
          done = true;
          el.style.opacity = "0";
          setTimeout(function () {
            if (el && el.parentNode) el.parentNode.removeChild(el);
          }, 260);
        };
        // Rede de segurança: nunca deixar a app presa no splash se o JS falhar.
        setTimeout(window.__yesolaHideBootSplash, 6000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
