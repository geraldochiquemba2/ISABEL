services:
  # 1. API Server (Backend)
  - type: web
    name: isabel-loja-api
    env: node
    rootDir: artifacts/guia-lojas
    buildCommand: npm install -g pnpm@9 && pnpm install && pnpm run build # build gera dist/public (o servidor serve o frontend a partir daí; sem isto o fallback SPA falha)
    startCommand: pnpm exec tsx server/index.ts
    healthCheckPath: /api/ping # o Render reinicia deploys que deixem de responder aqui
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_OPTIONS
        value: --max-old-space-size=384 # free 512MB: GC antes do cgroup matar o container
      - key: DATABASE_URL
        sync: false # Configura o teu URL de base de dados no painel do Render
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: RENDER_EXTERNAL_URL
        value: https://isabel-loja-api.onrender.com # URL pública da API. O self-ping anti-sleep (server/index.ts) precisa disto com valor — NÃO deixar vazia nem com sync: false.

  # 2. Frontend (Static Site)
  - type: web # type web + runtime static = Static Site (com CDN global, mais rápido que servir pelo Node)
    name: isabel-loja-frontend
    runtime: static # (antes: env: static — campo antigo, mesma função)
    rootDir: artifacts/guia-lojas
    buildCommand: npm install -g pnpm@9 && pnpm install && pnpm run build
    staticPublishPath: dist
    routes:
      - type: rewrite # SPA: deep-links (/loja/xxx, /explorar...) caem no index.html em vez de 404
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_URL
        value: https://isabel-loja-api.onrender.com # Ajustar se necessário após o deploy da API
