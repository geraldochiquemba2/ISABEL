# YESOLA iOS — alternativa gratuita ao Codemagic (fila lenta).
# Mac grátis do GitHub (~8 builds/mês). Assinatura 100% automática via
# App Store Connect API key (3 secrets no repo: ASC_KEY_ID,
# ASC_ISSUER_ID, ASC_PRIVATE_KEY — os mesmos da conta, já existem).
name: YESOLA iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "artifacts/guia-lojas/**"
      - ".github/workflows/ios.yml"
      - "ExportOptions.plist"

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: artifacts/guia-lojas
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --prefer-offline --no-frozen-lockfile

      - name: Build web assets
        run: pnpm run build
        env:
          PORT: "3000"
          BASE_PATH: "/"
          NODE_ENV: production

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install --repo-update

      - name: Fetch signing files (perfil App Store)
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          pip3 install --break-system-packages codemagic-cli-tools
          echo "${{ secrets.DISTRIBUTION_P12 }}" | base64 -d > "$RUNNER_TEMP/dist.p12"
          echo "${{ secrets.YESOLA_KEY }}" > "$RUNNER_TEMP/yesola.key"
          chmod 600 "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/yesola.key"
          keychain initialize
          keychain add-certificates --certificate "$RUNNER_TEMP/dist.p12" --certificate-password "${{ secrets.P12_PASSWORD }}"
          app-store-connect fetch-signing-files "pt.yesola.app" \
            --platform IOS \
            --type IOS_APP_STORE \
            --certificate-key "@file:$RUNNER_TEMP/yesola.key" \
            --create

      - name: Keychain + profiles
        run: |
          keychain initialize
          keychain add-certificates
          cd ios/App
          xcode-project use-profiles

      - name: Archive (assinatura manual via perfil)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            archive

      - name: Export IPA
        run: |
          cd ios/App
          PROF=$(python3 - <<'EOF'
          import glob, os, subprocess, plistlib
          best = None
          for f in glob.glob(os.path.expanduser("~/Library/MobileDevice/Provisioning Profiles/*.mobileprovision")):
              out = subprocess.run(["security", "cms", "-D", "-i", f], capture_output=True).stdout
              try:
                  pl = plistlib.loads(out)
              except Exception as e:
                  print(f"ilegivel: {f} {e}")
                  continue
              appid = pl.get("Entitlements", {}).get("application-identifier", "?")
              print(f"perfil: {pl.get('Name')} appid={appid}")
              if isinstance(appid, str) and appid.endswith("pt.yesola.app"):
                  best = pl.get("Name")
          print(f"ESCOLHIDO={best}")
          print(best or "")
          EOF
          )
          PROF=$(echo "$PROF" | tail -1)
          echo "Perfil: $PROF"
          python3 -c "import plistlib; plistlib.dump({'method':'app-store','teamID':'4ZQGZ9N775','uploadSymbols':True,'provisioningProfiles':{'pt.yesola.app':'$PROF'}}, open('ExportOptions.plist','wb'))"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: YESOLA-ios-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 14
