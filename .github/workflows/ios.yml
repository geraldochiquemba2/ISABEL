# YESOLA iOS — alternativa gratuita ao Codemagic (fila lenta).
# Mac grátis do GitHub (~8 builds/mês). Assinatura 100% automática via
# App Store Connect API key (3 secrets no repo: ASC_KEY_ID,
# ASC_ISSUER_ID, ASC_PRIVATE_KEY — os mesmos da conta, já existem).
# Rebuild forçado para subir o IPA com logo branco à TestFlight.
name: YESOLA iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "artifacts/guia-lojas/**"
      - ".github/workflows/ios.yml"
      - "ExportOptions.plist"

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      HAS_APP_STORE_ID: ${{ secrets.APP_STORE_APP_ID }}
    defaults:
      run:
        working-directory: artifacts/guia-lojas
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --prefer-offline --no-frozen-lockfile

      - name: Build web assets
        run: pnpm run build
        env:
          PORT: "3000"
          BASE_PATH: "/"
          NODE_ENV: production

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Bump build number
        run: |
          python3 -c "import re; p='ios/App/App.xcodeproj/project.pbxproj'; s=open(p).read(); s=re.sub(r'CURRENT_PROJECT_VERSION = \d+;', 'CURRENT_PROJECT_VERSION = $GITHUB_RUN_NUMBER;', s); open(p,'w').write(s)"
          grep -m2 "CURRENT_PROJECT_VERSION" ios/App/App.xcodeproj/project.pbxproj

      - name: Generate icons+splash (ferramenta oficial)
        run: npx -y @capacitor/assets generate --iconBackgroundColor '#ffffff' --splashBackgroundColor '#ffffff'

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install --repo-update

      - name: Signing (cert + perfil App Store)
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          pip3 install --break-system-packages codemagic-cli-tools
          echo "${{ secrets.DISTRIBUTION_P12 }}" | base64 -d > "$RUNNER_TEMP/dist.p12"
          echo "${{ secrets.YESOLA_KEY }}" > "$RUNNER_TEMP/yesola.key"
          chmod 600 "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/yesola.key"
          # UM único keychain: o segundo `keychain initialize` apagava o
          # certificado e o Archive falhava sem identidade de assinatura.
          keychain initialize
          keychain add-certificates --certificate "$RUNNER_TEMP/dist.p12" --certificate-password "${{ secrets.P12_PASSWORD }}"
          app-store-connect fetch-signing-files "pt.yesola.app" \
            --platform IOS \
            --type IOS_APP_STORE \
            --certificate-key "@file:$RUNNER_TEMP/yesola.key" \
            --create
          cd ios/App
          xcode-project use-profiles
          cd "$GITHUB_WORKSPACE/artifacts/guia-lojas"
          echo "--- perfis no workspace ---"
          ls *.mobileprovision ios/App/*.mobileprovision 2>/dev/null || true
          echo "--- perfis instalados ---"
          ls "$HOME/Library/MobileDevice/Provisioning Profiles/" || true

      - name: Archive (assinatura manual via perfil)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            archive

      - name: Prepare ExportOptions.plist (perfil App Store)
        run: |
          python3 - <<'EOF'
          import glob, os, plistlib, shutil, subprocess, sys
          prov_dir = os.path.expanduser("~/Library/MobileDevice/Provisioning Profiles")
          ws = os.environ.get("GITHUB_WORKSPACE", "")
          patterns = [os.path.join(prov_dir, "*.mobileprovision")]
          if ws:
              patterns.append(os.path.join(ws, "artifacts", "guia-lojas", "*.mobileprovision"))
              patterns.append(os.path.join(ws, "artifacts", "guia-lojas", "ios", "App", "*.mobileprovision"))
          seen = set()
          profiles = []
          for pat in patterns:
              for p in glob.glob(pat):
                  if p not in seen:
                      seen.add(p)
                      profiles.append(p)
          print(f"Perfis encontrados: {len(profiles)}")
          os.makedirs(prov_dir, exist_ok=True)
          for p in profiles:
              dest_p = os.path.join(prov_dir, os.path.basename(p))
              if os.path.abspath(p) != os.path.abspath(dest_p):
                  shutil.copy(p, dest_p)
                  print(f"instalado: {os.path.basename(p)}")
          bundle = "pt.yesola.app"
          team = "4ZQGZ9N775"
          chosen = None
          for p in profiles:
              try:
                  out = subprocess.run(["security", "cms", "-D", "-i", p], capture_output=True, check=True).stdout
                  d = plistlib.loads(out)
                  name = d.get("Name", "")
                  app_id = ((d.get("Entitlements", {}) or {}).get("application-identifier", ""))
                  print(f"- {os.path.basename(p)} name={name!r} app_id={app_id!r}")
                  if app_id in (f"{team}.{bundle}", bundle) or app_id.endswith("." + bundle):
                      chosen = name
              except Exception as e:
                  print(f"! falha a ler {p}: {e}")
          if not chosen:
              print("ERRO: nenhum perfil para pt.yesola.app", file=sys.stderr)
              sys.exit(1)
          print(f"Perfil escolhido: {chosen}")
          export_plist = {
              "method": "app-store-connect",
              "teamID": team,
              "signingStyle": "manual",
              "provisioningProfiles": {bundle: chosen},
              "uploadSymbols": True,
          }
          dest = os.path.join(os.environ["RUNNER_TEMP"], "ExportOptions.plist")
          with open(dest, "wb") as f:
              plistlib.dump(export_plist, f, fmt=plistlib.FMT_XML)
          print(f"ExportOptions escrito em {dest}")
          EOF
          cat "$RUNNER_TEMP/ExportOptions.plist"

      - name: Export IPA
        run: |
          cd ios/App
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: YESOLA-ios-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 14

      # Subida automática para TestFlight: ativa quando a app YESOLA
      # existir no App Store Connect (diz-me o Apple ID numérico e
      # preencho APP_STORE_APP_ID nos secrets).
      - name: Publish to TestFlight
        if: env.HAS_APP_STORE_ID != ''
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          pip3 install --break-system-packages codemagic-cli-tools
          IPA=$(ls "$RUNNER_TEMP"/ipa/*.ipa | head -1)
          echo "IPA=$IPA"
          test -f "$IPA"
          app-store-connect publish \
            --path "$IPA" \
            --testflight \
            --beta-build-localizations '[{"locale":"pt-PT","description":"YESOLA - guia de lojas e servicos de Angola.","whats_new":"Primeira versao TestFlight."}]' \
            --max-build-processing-wait 20
